<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participation Based Certificates | Kamakshi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7C3AED;
            --primary-hover: #6366F1;
            --bg-main: #ffffff;
            --text-heading: #111827;
            --text-body: #4b5563;
        }
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-body);
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
        }
        .cert-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 4rem 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.05);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .cert-card:hover {
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(124, 58, 237, 0.08);
        }
        h1 { color: var(--text-heading); margin-bottom: 1rem; font-size: 2rem; }
        p { color: var(--text-body); margin-bottom: 2rem; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
        }
        a:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>
    <div class="cert-card">
        <h1>Participation Based Certificates</h1>
        <p>This page will display all of your participation-based certificates.</p>
        <a href="index.html">Back to Portfolio</a>
    </div>
</body>
</html>
